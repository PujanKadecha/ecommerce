name: Backend Automated Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:

    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          PORT: 5000
          API_VERSION: v1
          CLIENT_URL: http://localhost:5173

          # Database — uses MONGO_URI_TEST if set (see auth.test.js), falls back to local
          MONGO_URI: mongodb://localhost:27017/ecommerce_test
          MONGO_URI_TEST: mongodb://localhost:27017/ecommerce_test

          # Redis — uses the service spun up above
          REDIS_URL: redis://localhost:6379

          # JWT — names must match config/env.js exactly
          JWT_ACCESS_SECRET: test_dummy_jwt_access_secret_key_32chars
          JWT_ACCESS_EXPIRES: 15m
          JWT_REFRESH_SECRET: test_dummy_jwt_refresh_secret_key_32chars
          JWT_REFRESH_EXPIRES: 7d

          # Cookie
          COOKIE_SECRET: test_dummy_cookie_secret
          COOKIE_EXPIRES: 7

          # Stripe — must start with sk_test_ for the Stripe constructor to accept it
          STRIPE_SECRET_KEY: sk_test_dummy_key_for_ci_testing_only

          # Cloudinary — dummy values so the module loads without error
          CLOUDINARY_CLOUD_NAME: dummy_cloud
          CLOUDINARY_API_KEY: "000000000000000"
          CLOUDINARY_API_SECRET: dummy_secret

          # Email — dummy values (no real emails sent in tests)
          EMAIL_HOST: smtp.example.com
          EMAIL_PORT: 465
          EMAIL_USER: test@example.com
          EMAIL_PASS: dummy_pass

          # Google OAuth — dummy values
          GOOGLE_CLIENT_ID: dummy_google_client_id
          GOOGLE_CLIENT_SECRET: dummy_google_client_secret
          GOOGLE_CALLBACK_URL: http://localhost:5000/api/v1/auth/google/callback