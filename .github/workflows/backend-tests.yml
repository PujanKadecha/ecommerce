name: Backend Automated Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:

    runs-on: ubuntu-latest

    
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
      
      - name: Checkout repository
        uses: actions/checkout@v4

  
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './ecommerce-main/backend/package-lock.json'

     
      - name: Install dependencies
        working-directory: ./ecommerce-main/backend
        run: npm ci

   
      - name: Run tests
        working-directory: ./ecommerce-main/backend
        run: npm test
        env:
          MONGO_URI_TEST: mongodb://localhost:27017/ecommerce_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_dummy_jwt_secret_key
          STRIPE_SECRET_KEY: test_dummy_stripe_key